[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "infraimpact"
version = "0.1.0"
description = "Dynamic Infrastructure Impact Intelligence Platform - Foundation backend (Seattle / Greater Puget Sound)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "httpx>=0.27",
    # Windows ships no system tz database, so ZoneInfo needs the wheel.
    "tzdata>=2024.1",
    # Reused open-source engines (see THIRD_PARTY.md) instead of custom code.
    "networkx>=3.2",   # BSD-3: shortest paths, connected components
    "shapely>=2.0",    # BSD-3: GEOS geometry predicates/buffers/areas
    "numpy>=1.26",     # BSD-3: numerics
    "ruptures>=1.1",   # BSD-2: PELT change-point detection
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
kafka = ["aiokafka>=0.11"]
postgres = ["psycopg[binary]>=3.2"]
s3 = ["boto3>=1.35"]

[project.scripts]
infraimpact = "infraimpact.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore::DeprecationWarning"]